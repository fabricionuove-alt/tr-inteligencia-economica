name: Rt
# Rt lee los 10-K nuevos y opera con plata ficticia. Reglas: notas/15-rt.md
on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths: ['rt/rt.py', 'rt/cortes.json', 'rt/requisitos.txt', 'modelos/palabras146.npz', '.github/workflows/rt.yml']
  workflow_dispatch:
    inputs:
      control:
        description: 'Leer las 5 empresas de control (comprueba que la lectura en GitHub da lo mismo que al armar Tr v5)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rt
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rt/requisitos.txt
      - run: pip install -r rt/requisitos.txt
      - name: edgar-crawler (la herramienta de EDGAR-CORPUS, versión fija)
        run: git clone -q https://github.com/lefterisloukas/edgar-crawler rt/_edgar-crawler && git -C rt/_edgar-crawler checkout -q 84a8d0c5dd7dd6769526e5ccec534c4e0880d56f
      - name: Control
        if: ${{ inputs.control }}
        run: python rt/rt.py control
      - name: Rt
        run: python rt/rt.py
      - name: Guardar
        run: |
          git config user.name "Rt"
          git config user.email "rt@users.noreply.github.com"
          for f in estado.json operaciones.jsonl valor.csv lecturas.jsonl control.log; do [ -f rt/$f ] && git add rt/$f; done; true
          git diff --cached --quiet || (git commit -m "Rt $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
